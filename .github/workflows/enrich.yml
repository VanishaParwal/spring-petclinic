name: AccuKnox SBOM Scan Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build first so the SBOM includes resolved dependencies and Syft can enrich their licenses
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B -DskipTests package

      - name: Run AccuKnox SBOM Scan
        uses: VanishaParwal/sbom_action@main
        with:
          # SBOM project name in AccuKnox
          project_name: "enrich"

          # AccuKnox credentials
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}

          # Optional
          scan_path: "."             # Directory to scan ('filesystem <scan_path>')
         
